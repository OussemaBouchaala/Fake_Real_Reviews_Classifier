[mypy]
python_version = 3.12
mypy_path = app
# app/streamlit.py is left out: its module name clashes with the streamlit package
files = app/api.py, app/config.py, app/text_features.py, app/utils.py
disallow_untyped_defs = True
# scikit-learn and joblib ship no type stubs
ignore_missing_imports = True
